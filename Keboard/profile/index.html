<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page By Aashish kumar</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: rgb(164, 71, 124);

        }
        .profile-container{
            width: 100%;
            max-width: 450px;
            margin: 100px auto;
            background: #cfa0ca;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgb(15, 13, 13);
            text-align: center;
            padding: 40px;
        }
        .profile-container img{
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #f02f3f;
        }
        .profile-container hi{
            margin: 15px 0 10px;
            font-size: 24px;
            color: #b43535;

        }
        .profile-container p{
            color: #dc0f3e;
            margin: 0 0 45px;
        }
        .profile-container a{
            display: inline-block;
            text-decoration: none;
            background-color: #4caf50;
            color: rgb(14, 8, 8);
            padding: 14px 30px;
            border-radius: 10px;
            transition: background-color 0.3s;
        }
        .profile-container a:hover{
            background-color: #a689bf;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <img src="profile.jpg"alt="Profile Picture">
        <h1>AASHISH KUMAR</h1>
        <p> SOFTWARE ENGINEER \ WEB DEVELOPER </p>
        <a href="AASHISH:aashishkumarbind6@gmail.com"> Contact Me </a>
    </div>
    
</body>
</html>
