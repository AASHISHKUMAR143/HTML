<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gride layout</title>
    <style>
        .header{
            background-color:darkorange;
            position: absolute;
            top: 1%;
            left: 1%;
            width: 98%;
            height: 30%;

        }
        .main{
            background-color: aqua;
            position: absolute;
            top: 32%;
            left: 1%;
            width: 49%;
            height: 30%;
        }
        .empty{
            background-color: whitesmoke;
            position: absolute;
            top:32% ;
            left: 50.5%;
            width:24.5% ;
            height: 30%;
        }
        .sidebar{
            background-color: red;
            position: absolute;
            top: 32%;
            left: 75.5%;
            width: 23.5%;
            height: 30%;
        }
        .footer{
            background-color: seagreen;
            position: absolute;
            top: 63%;
            left: 1%;
            width: 98%;
            height: 30%;

        }
    </style>
</head>
<body>
    <div class="header"></div>
    <div class="main"></div>
    <div class=" empty"></div>
    <div class="sidebar"></div>
    <div class="footer"></div>
    
</body>
</html>
